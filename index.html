<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/excelenc.ia/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Excelenc.IA — conversor inteligente de imagens e PDFs para Excel.">
  <meta name="theme-color" content="#0A2342">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Excelenc.IA">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Excelenc.IA</title>

  <!-- PDF.js exigido pelo pdfx no Flutter Web. Deve ser carregado antes do
       flutter_bootstrap.js para que PdfDocument.openData funcione. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      window.pdfRenderOptions = {
        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
        cMapPacked: true,
        standardFontDataUrl:
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
      };
    } else {
      console.error('PDF.js não foi carregado. A abertura de PDFs ficará indisponível.');
    }
  </script>

  <script>
    // Carrega o OCR apenas no primeiro uso. Assim, uma falha no CDN nunca
    // impede o Flutter de iniciar e evita a tela branca no Chrome/Pages.
    let tesseractLoader;

    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      if (tesseractLoader) return tesseractLoader;

      tesseractLoader = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/tesseract.js@4.0.2/dist/tesseract.min.js';
        script.crossOrigin = 'anonymous';
        script.onload = () => resolve(window.Tesseract);
        script.onerror = () => {
          tesseractLoader = null;
          reject(new Error('Não foi possível carregar o mecanismo OCR. Verifique a internet e tente novamente.'));
        };
        document.head.appendChild(script);
      });

      return tesseractLoader;
    }

    window._extractText = async function (imagePath, mapData) {
      const Tesseract = await loadTesseract();
      const options = mapData || {};
      const language = options.language || 'eng';
      const parameters = options.args || {};
      let worker;

      try {
        worker = await Tesseract.createWorker();
        await worker.load();
        await worker.loadLanguage(language);
        await worker.initialize(language);
        await worker.setParameters(parameters);

        const result = await worker.recognize(imagePath);
        if (parameters.tessjs_create_hocr) {
          return result.data.hocr || '';
        }
        return result.data.text || '';
      } finally {
        if (worker) await worker.terminate();
      }
    };

    // Reconhecimento principal: a IA recebe a página inteira e devolve uma
    // matriz, preservando a relação entre linhas, colunas e células largas.
    // A chave é informada pelo usuário e nunca faz parte do build publicado.
    window.excelenciaRecognizeTable = async function (apiKey, imageBase64, mimeType) {
      const endpoint =
        'https://generativelanguage.googleapis.com/v1beta/models/' +
        'gemini-2.5-flash:generateContent';
      const prompt = `
Você é um mecanismo de digitalização de planilhas. Transcreva SOMENTE a tabela
visível na imagem para uma matriz retangular.

REGRAS OBRIGATÓRIAS:
- conte as colunas pelas divisórias reais da grade, nunca pelo espaçamento do texto;
- conte todas as linhas da grade, inclusive linhas parcialmente vazias;
- mantenha cada conteúdo na célula física em que aparece;
- uma célula larga continua sendo UMA célula; nunca divida sua frase;
- preserve cabeçalhos, acentos, códigos, sinais, vírgulas e pontos decimais;
- use string vazia para célula vazia;
- não invente, complete ou corrija valores ilegíveis: use "[ilegível]";
- todas as linhas devem ter exatamente column_count células;
- ignore textos, manchas e marcas fora da tabela.
`;
      const body = {
        contents: [{ parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType || 'image/png', data: imageBase64 } }
        ] }],
        generationConfig: {
          temperature: 0,
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            required: ['column_count', 'rows'],
            properties: {
              column_count: { type: 'INTEGER', minimum: 1, maximum: 100 },
              rows: {
                type: 'ARRAY',
                maxItems: 300,
                items: {
                  type: 'OBJECT',
                  required: ['cells'],
                  properties: {
                    cells: {
                      type: 'ARRAY',
                      maxItems: 100,
                      items: { type: 'STRING' }
                    }
                  }
                }
              }
            }
          }
        }
      };
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': apiKey
        },
        body: JSON.stringify(body)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = payload?.error?.message || `Erro HTTP ${response.status}`;
        throw new Error(message);
      }
      const text = payload?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('A IA não retornou uma tabela.');
      return text;
    };

    window.addEventListener('error', (event) => {
      console.error('Erro ao iniciar o Excelenc.IA:', event.error || event.message);
    });
    window.addEventListener('unhandledrejection', (event) => {
      console.error('Falha assíncrona no Excelenc.IA:', event.reason);
    });
  </script>
</head>
<body>
  <noscript>Ative o JavaScript para usar o Excelenc.IA.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
